feature: 2026-06-11-media-file-info
created: 2026-06-11

steps:
  - action: "编排骨架：建立 getMediaInfo(path) 的异步调用和 typed exception 通道，native 节点先返回 stub payload"
    exit_signal: "Dart 调用能从入口走到 subtype 组装，stub 图片结果可返回 ImageMediaInfo"
    status: done
  - action: "名词契约：落地 BaseMediaInfo 继承体系、subtype MIME enum、metadata / EXIF 承载对象"
    exit_signal: "Dart 单测能通过 BaseMediaInfo 接收，并用 is ImageMediaInfo 访问图片字段"
    status: done
  - action: "native 探测节点：实现单个本地文件的 probe，覆盖图片、视频、音频核心字段"
    exit_signal: "真实测试文件能读出宽高、时长、帧率、采样率、声道、codec、bitrate 中对应字段"
    status: done
  - action: "metadata / EXIF 映射：把 native 返回的容器 metadata 和图片 EXIF 映射到 Dart 对象"
    exit_signal: "含 EXIF 的图片返回非空 exif；含 metadata 的媒体返回 metadata"
    status: done
  - action: "错误与边界：补齐不存在、不可读、unsupported、缺字段、probe failed 的错误语义"
    exit_signal: "每类错误都有 typed exception 或明确空值策略，调用方无需解析 native 原始字符串"
    status: done
  - action: "验收覆盖：补齐图片、视频、音频和反向范围守护测试"
    exit_signal: "第 3 节关键场景均有可观察证据"
    status: done

